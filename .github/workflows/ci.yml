name: Verify Crunch Week
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check crunch_week tests scripts
      - run: python -m pytest --cov=crunch_week
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python -m uvicorn crunch_week.api:app --host 127.0.0.1 --port 8000 > /tmp/crunch-week.log 2>&1 &
          python -c "import time, urllib.request; time.sleep(3); urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      - run: npm run test:e2e
        working-directory: frontend
